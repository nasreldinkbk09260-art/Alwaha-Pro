name: Build Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: فحص الكود
        uses: actions/checkout@v4

      - name: إعداد بيئة Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت التبعيات وبناء الويب
        run: |
          npm install
          npm run build || true

      - name: إعداد مشروع Android وربطه بـ Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: توليد أيقونات التطبيق وشاشة البداية
        run: |
          npm install -g @capacitor/assets
          if [ -f "logo.png" ]; then
            cp logo.png icon.png || true
            cp logo.png splash.png || true
          fi
          npx capacitor-assets generate --android --splashBackgroundColor "#0d1117" || true

      - name: بناء نسختي APK و AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: رفع ملف APK الجاهز للتثبيت
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: رفع ملف AAB الخاص بالمتجر
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-AAB
          path: android/app/build/outputs/bundle/release/*.aab
