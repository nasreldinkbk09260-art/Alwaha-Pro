name: Build Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: فحص الكود
        uses: actions/checkout@v4

      - name: إعداد بيئة Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت التبعيات وبناء الويب
        run: |
          npm install
          npm run build || true

      - name: إعداد مشروع Android وربطه بـ Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: توليد أيقونات الشاشة الافتتاحية والشعار تلقائياً
        run: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android --splashBackgroundColor "#0d1117"

      - name: إنشاء مفتاح التوقيع تلقائياً (Keystore)
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias alwaha_key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass alwaha123 -keypass alwaha123 \
            -dname "CN=Alwaha, OU=Dev, O=Alwaha, L=Cairo, C=EG"

      - name: ضبط إعدادات التوقيع في Gradle
        run: |
          cat << 'EOF' > android/app/build.gradle.updated
          apply plugin: 'com.android.application'

          android {
              compileSdkVersion rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "pro.alwaha.app"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "2.7.0"
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'alwaha123'
                      keyAlias 'alwaha_key'
                      keyPassword 'alwaha123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
          }

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text.trim()) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }
          EOF
          mv android/app/build.gradle.updated android/app/build.gradle

      - name: بناء نسختي APK و AAB الموقعتين
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: رفع ملفات APK و AAB الناتجة
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-Release-Builds
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
