name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: قبول تراخيص Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: تجهيز مجلد dist ونقل الملفات
        run: |
          mkdir -p dist
          cp -r index.html sw.js manifest.json icon.png app.js style.css privacy.html dist/ 2>/dev/null || true

      - name: تثبيت Capacitor وإعداد البيئة
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: تهيئة Capacitor وإنشاء مجلد Android
        run: |
          npx cap init "Alwaha Pro" "com.alwahapro.app" --web-dir dist
          npx cap add android

      - name: تطبيق أيقونة التطبيق وحذف التعارضات
        run: |
          RES_DIR="android/app/src/main/res"
          
          # حذف مجلد الـ XML الذي يسبب التكرار والتعارض
          rm -rf $RES_DIR/mipmap-anydpi-v26
          
          # استبدال جميع الصور في مجلدات Mipmap بـ icon.png
          for dir in $RES_DIR/mipmap-*; do
            rm -f $dir/ic_launcher*
            cp icon.png "$dir/ic_launcher.png"
            cp icon.png "$dir/ic_launcher_round.png"
            cp icon.png "$dir/ic_launcher_foreground.png"
          done

      - name: مزامنة الملفات مع مشروع Android
        run: |
          npx cap sync android

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlwahaPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
