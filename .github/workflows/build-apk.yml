name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/checkout@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: تجهيز مجلد dist ونقل الملفات
        run: |
          mkdir -p dist
          cp -r index.html sw.js manifest.json icon.png app.js style.css privacy.html dist/ 2>/dev/null || true
          cp -r * dist/ 2>/dev/null || true

      - name: تثبيت Capacitor وإعداد البيئة
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: تهيئة Capacitor وإنشاء مجلد Android
        run: |
          npx cap init "Alwaha Pro" "com.alwahapro.app" --web-dir dist
          npx cap add android

      - name: مزامنة الملفات مع مشروع Android
        run: |
          npx cap sync android

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK كـ Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AlwahaPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
