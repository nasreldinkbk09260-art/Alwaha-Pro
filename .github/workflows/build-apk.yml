name: Build Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: فحص الكود
        uses: actions/checkout@v4

      - name: إعداد بيئة Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت التبعيات وبناء الويب
        run: |
          npm install
          npm run build || true

      - name: إعداد مشروع Android وربطه بـ Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: توليد أيقونات الشاشة الافتتاحية والشعار تلقائياً
        run: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android --splashBackgroundColor "#0d1117"

      - name: بناء نسختي APK و AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: رفع ملفات APK و AAB الناتجة
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-Release-Builds
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
