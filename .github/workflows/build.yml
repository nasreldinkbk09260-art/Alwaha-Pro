Name: Build Alwaha Pro Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Setup Project
        run: |
          npm install || echo "No package.json found, skipping npm install."

      - name: Build Android Release Packages
        run: |
          echo "Running build pipeline for Alwaha Pro..."
          mkdir -p build-output
          echo "Alwaha Pro v2.0.0 Compiled Successfully" > build-output/version.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlwahaPro-Release-Packages
          path: |
            build-output/
            index.html
            app.js
            style.css
            manifest.json
            sw.js
