name: Build Android AAB (Bundle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android Bundle (AAB)
        run: |
          cordova platform add android || true
          cordova build android --release -- --packageType=bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: platforms/android/app/build/outputs/bundle/release/
