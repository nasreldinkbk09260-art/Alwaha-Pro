name: Build All (APK & AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare Web Directory & Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          cp index.html app.js style.css manifest.json sw.js icon.png www/ 2>/dev/null || :
          npx cap init AlwahaPro com.alwaha.pro --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-alwaha
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release AAB
        working-directory: ./android
        run: ./gradlew bundleRelease

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
