name: Build & Sign Alwaha Pro Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-release:
    name: Build & Sign Official Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Initialize Project & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Prepare Web Assets (www directory)
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js privacy.html www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

      - name: Configure Capacitor Project
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.alwahapro.app",
            "appName": "Alwaha Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          rm -rf android
          npx cap add android

      - name: Generate App Icons & Splash Screen
        run: |
          # السماح لـ ImageMagick بمعالجة الصور
          sudo sed -i 's/domain="coder" rights="none"/domain="coder" rights="read|write"/g' /etc/ImageMagick-6/policy.xml 2>/dev/null || true
          
          if [ -f "icon.png" ]; then
            mkdir -p assets
            # تجهيز الأيقونات بأعلى دقة بدقة 1024x1024 وبدون إطار متصفح
            convert icon.png -resize 1024x1024 assets/icon-only.png 2>/dev/null || cp icon.png assets/icon-only.png
            convert icon.png -resize 1024x1024 assets/icon-foreground.png 2>/dev/null || cp icon.png assets/icon-foreground.png
            convert icon.png -resize 1024x1024 -background "#090212" -alpha remove assets/icon-background.png 2>/dev/null || cp icon.png assets/icon-background.png
            convert icon.png -resize 512x512 -background "#090212" -gravity center -extent 2732x2732 assets/splash.png 2>/dev/null || true
            
            # توليد جميع أحجام أيقونات الأندرويد والشاشة الافتتاحية رسمياً
            npx capacitor-assets generate --android || true
          fi

      - name: Sync Code to Android Native Platform
        run: |
          npx cap sync android

      - name: Build Android Release (APK & AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK Artifact (للتثبيت المباشر)
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/*-signed.apk

      - name: Upload Signed AAB Artifact (لمتجر جوجل بلاي)
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-Signed-AAB
          path: android/app/build/outputs/bundle/release/*-signed.aab
