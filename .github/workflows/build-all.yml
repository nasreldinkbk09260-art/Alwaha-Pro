name: Build Alwaha Pro (Production Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Project and Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Isolate Web Assets into www Directory
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js www/ 2>/dev/null || true
          cp *.png *.jpg www/ 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          cat << 'EOC' > capacitor.config.json
          {
            "appId": "com.alwaha.pro",
            "appName": "Alwaha Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOC
          rm -rf android
          npx cap add android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Code to Android Project
        run: |
          npx cap sync android

      - name: Build Official Release APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-AAB
          path: android/app/build/outputs/bundle/release/*.aab
