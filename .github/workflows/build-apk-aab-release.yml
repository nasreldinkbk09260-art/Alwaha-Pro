name: Alwaha-Pro • Supabase Migration + Android APK/AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alwaha-pro-main
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  PACKAGE_ID: 'pro.alwaha.app'
  SUPABASE_PROJECT_ID: 'kjuixjdtqwcsnxefftrt'

jobs:
  deploy-and-build:
    name: Deploy database + build signed Android
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1) تحميل المشروع
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7.0.1


      # ============================================================
      # 2) فحص ملفات المشروع الأساسية
      # ============================================================
      - name: Validate application version and required files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.png
          test -f capacitor.config.json
          test -f package.json
          test -f supabase/config.toml
          test -f supabase/migrations/20260920090000_alwaha_pro_v282.sql

          grep -q 'Alwaha-Pro 2.8.2' index.html
          grep -q '"appId": "pro.alwaha.app"' capacitor.config.json

          echo "Project files validated successfully."


      # ============================================================
      # 3) تثبيت Supabase CLI
      # ============================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest


      # ============================================================
      # 4) فحص أسرار Supabase
      # ============================================================
      - name: Validate Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: Missing GitHub Secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ERROR: Missing GitHub Secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi

          echo "Supabase secrets are available."


      # ============================================================
      # 5) تنظيف حالة Supabase القديمة
      #
      # مهم:
      # .temp و .branches حالات داخلية للـSupabase CLI.
      # نحذفها قبل link حتى لا يحاول CLI استخدام Branch قديم.
      # ============================================================
      - name: Clean Supabase CLI link state
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning old Supabase CLI state..."

          rm -rf supabase/.temp
          rm -rf supabase/.branches

          echo "Supabase CLI state cleaned."


      # ============================================================
      # 6) فحص Supabase Project ID
      # ============================================================
      - name: Validate Supabase project reference
        shell: bash
        run: |
          set -euo pipefail

          echo "Supabase Project ID:"
          echo "$SUPABASE_PROJECT_ID"

          test "$SUPABASE_PROJECT_ID" = "kjuixjdtqwcsnxefftrt"

          echo "Supabase Project ID validated."


      # ============================================================
      # 7) التحقق من المشروع ثم ربط Supabase
      # ============================================================
      - name: Verify and link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Supabase Project Verification"
          echo "=========================================="

          echo "Project Ref: $SUPABASE_PROJECT_ID"

          test "$SUPABASE_PROJECT_ID" = "kjuixjdtqwcsnxefftrt"

          echo "Project reference format is correct."

          echo "Supabase CLI version:"
          supabase --version

          echo "Removing any temporary CLI state..."
          rm -rf supabase/.temp
          rm -rf supabase/.branches

          echo "Linking production/base Supabase project..."

          if ! supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"; then

            echo ""
            echo "=========================================="
            echo "SUPABASE LINK FAILED"
            echo "Running diagnostic information..."
            echo "=========================================="

            supabase link \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --password "$SUPABASE_DB_PASSWORD" \
              --debug

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Supabase project linked successfully."
          echo "=========================================="


      # ============================================================
      # 8) التحقق من المشروع المرتبط
      # ============================================================
      - name: Verify Supabase link
        shell: bash
        run: |
          set -euo pipefail

          echo "Supabase linked project state:"

          if [ -f supabase/.temp/project-ref ]; then
            echo "project-ref:"
            cat supabase/.temp/project-ref
          fi

          if [ -f supabase/.temp/linked-project.json ]; then
            echo "linked-project.json:"
            cat supabase/.temp/linked-project.json
          fi

          echo "Supabase link verification completed."


      # ============================================================
      # 9) فحص migration history
      # ============================================================
      - name: Check Supabase migration status
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase migration status..."

          supabase migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Migration status checked successfully."


      # ============================================================
      # 10) تطبيق migrations تلقائيًا
      # ============================================================
      - name: Deploy Supabase migrations automatically
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying pending Supabase migrations..."

          supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

          echo "Supabase migrations deployed successfully."


      # ============================================================
      # 11) إعداد حساب الإدارة اختياريًا
      # ============================================================
      - name: Configure optional Alwaha admin account
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ALWAHA_ADMIN_EMAIL: ${{ secrets.ALWAHA_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ALWAHA_ADMIN_EMAIL:-}" ]; then
            echo "ALWAHA_ADMIN_EMAIL is not configured."
            echo "Admin auto-bootstrap will be skipped."
            exit 0
          fi

          escaped_email="$(printf '%s' "$ALWAHA_ADMIN_EMAIL" | sed "s/'/''/g")"

          supabase db query \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            "insert into public.app_settings(key,value,updated_at)
             values (
               'initial_admin_email',
               '$escaped_email',
               now()
             )
             on conflict (key)
             do update set
               value=excluded.value,
               updated_at=now();

             update public.users
             set
               is_admin=true,
               updated_at=now()
             where lower(identifier)=lower('$escaped_email');"

          echo "Optional admin configuration completed."


      # ============================================================
      # 12) إعداد Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 13) إعداد Java JDK
      # ============================================================
      - name: Setup Java JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 14) تثبيت Dependencies
      # ============================================================
      - name: Install web/native dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Capacitor:"
          npx cap --version

          echo "Java:"
          java -version


      # ============================================================
      # 15) بناء Web
      # ============================================================
      - name: Build web bundle
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          echo "Web build completed."


      # ============================================================
      # 16) فحص JavaScript
      # ============================================================
      - name: Validate web JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const html = fs.readFileSync('index.html', 'utf8');

          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');

          if (start < 0 || end <= start) {
            throw new Error('Inline app script not found');
          }

          fs.writeFileSync(
            '/tmp/alwaha-pro.js',
            html.slice(start + '<script>'.length, end),
            'utf8'
          );
          NODE

          node --check /tmp/alwaha-pro.js

          echo "JavaScript syntax check passed."


      # ============================================================
      # 17) فحص onclick
      # ============================================================
      - name: Validate all visible onclick handlers
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const html = fs.readFileSync('index.html', 'utf8');

          const funcs = new Set(
            [...html.matchAll(
              /\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g
            )].map(m => m[1])
          );

          const ignored = new Set([
            'if',
            'for',
            'while',
            'switch',
            'setTimeout',
            'remove',
            'closest',
            'filter',
            'map',
            'join',
            'click',
            'then',
            'catch',
            'push',
            'confirm',
            'console'
          ]);

          const missing = new Set();

          for (const match of html.matchAll(/onclick="([^"]+)"/g)) {

            for (const fn of match[1].matchAll(
              /\b([A-Za-z_$][\w$]*)\s*\(/g
            )) {

              const name = fn[1];

              if (!funcs.has(name) && !ignored.has(name)) {
                missing.add(name);
              }
            }
          }

          if (missing.size) {
            throw new Error(
              `Missing onclick handlers: ${[...missing].join(', ')}`
            );
          }

          console.log(
            `onclick validation passed (${funcs.size} functions discovered).`
          );
          NODE


      # ============================================================
      # 18) إنشاء مشروع Android نظيف
      # ============================================================
      - name: Recreate clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          npx cap sync android

          grep -q 'pro.alwaha.app' android/app/build.gradle || {
            echo 'ERROR: Capacitor generated a different Android application ID.'
            exit 1
          }

          echo "Android project created successfully."


      # ============================================================
      # 19) إعداد صلاحيات Android والأيقونة
      # ============================================================
      - name: Configure Android permissions and launcher icon
        shell: bash
        run: |
          set -euo pipefail

          RES_DIR="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          rm -rf "$RES_DIR/mipmap-anydpi-v26"

          found=0

          for dir in "$RES_DIR"/mipmap-*; do

            [ -d "$dir" ] || continue

            found=1

            rm -f \
              "$dir/ic_launcher"* \
              "$dir/ic_launcher_round"* \
              "$dir/ic_launcher_foreground"*

            cp icon.png "$dir/ic_launcher.png"
            cp icon.png "$dir/ic_launcher_round.png"

          done

          test "$found" -eq 1

          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')

          text = p.read_text(encoding='utf-8')

          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]

          marker = '<application'

          if marker not in text:
              raise SystemExit(
                  'AndroidManifest.xml missing <application>'
              )

          lines = set(text.splitlines())

          add = [
              permission
              for permission in permissions
              if permission not in lines
          ]

          if add:
              text = text.replace(
                  marker,
                  '\n'.join(add) + '\n\n    ' + marker,
                  1
              )

              p.write_text(text, encoding='utf-8')

          PY

          echo "Android permissions and launcher icon configured."


      # ============================================================
      # 20) تحميل مفتاح التوقيع
      #
      # الأسرار الموجودة عندك:
      #
      # KEYSTORE_BASE64
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      # ============================================================
      - name: Load Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Missing GitHub Secret: KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: Missing GitHub Secret: KEY_ALIAS"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: Missing GitHub Secret: KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/keystore.properties <<PROP
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROP

          chmod 600 \
            android/release-key.jks \
            android/keystore.properties

          test -s android/release-key.jks

          echo "Android signing key loaded successfully."


      # ============================================================
      # 21) إعداد إصدار التطبيق والتوقيع
      # ============================================================
      - name: Configure release signing and version
        env:
          VERSION_NAME: '2.8.2'
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('android/app/build.gradle')

          text = p.read_text(encoding='utf-8')


          if 'keystorePropertiesFile' not in text:

              loader = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  new FileInputStream(keystorePropertiesFile)
              )
          }
          '''

              text = loader + text


          if 'signingConfigs {' not in text:

              m = re.search(
                  r'(?m)^android\s*\{\s*$',
                  text
              )

              if not m:
                  raise SystemExit(
                      'android { block not found'
                  )

              signing = r'''
              signingConfigs {
                  release {
                      storeFile keystoreProperties['storeFile'] ?
                          file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          '''

              text = (
                  text[:m.end()]
                  + signing
                  + text[m.end():]
              )


          m = re.search(
              r'(?s)defaultConfig\s*\{(.*?)\n\s*\}',
              text
          )

          if not m:
              raise SystemExit(
                  'defaultConfig block not found'
              )

          block = m.group(1)

          vc = os.environ['VERSION_CODE']
          vn = os.environ['VERSION_NAME']

          block = re.sub(
              r'(?m)^\s*versionCode\s+.*$',
              f'        versionCode {vc}',
              block
          )

          block = re.sub(
              r'(?m)^\s*versionName\s+.*$',
              f'        versionName "{vn}"',
              block
          )

          if 'versionCode' not in block:
              block = (
                  f'\n        versionCode {vc}'
                  + block
              )

          if 'versionName' not in block:
              block = (
                  f'\n        versionName "{vn}"'
                  + block
              )

          text = (
              text[:m.start(1)]
              + block
              + text[m.end(1):]
          )


          rm = re.search(
              r'(?s)(buildTypes\s*\{\s*release\s*\{)(.*?)\n\s*\}',
              text
          )

          if not rm:
              raise SystemExit(
                  'release buildType not found'
              )

          release_block = rm.group(2)

          if 'signingConfig signingConfigs.release' not in release_block:

              release_block = (
                  '\n            signingConfig signingConfigs.release'
                  + release_block
              )

          text = (
              text[:rm.start(2)]
              + release_block
              + text[rm.end(2):]
          )


          p.write_text(
              text,
              encoding='utf-8'
          )

          print('Android release configuration completed.')

          PY


      # ============================================================
      # 22) بناء APK + AAB
      # ============================================================
      - name: Build signed APK + AAB
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            clean \
            bundleRelease \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 23) التحقق من الملفات والتوقيع
      # ============================================================
      - name: Verify Android outputs
        shell: bash
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$AAB"
          test -s "$APK"

          echo "APK and AAB files exist."

          BUILD_TOOLS="$(
            ls -d "$ANDROID_HOME"/build-tools/* \
            | sort -V \
            | tail -n1
          )"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB" \
            >/tmp/aab-signature.txt

          grep -q 'jar verified' \
            /tmp/aab-signature.txt

          mkdir -p release

          cp "$AAB" \
            "release/Alwaha-Pro-2.8.2.aab"

          cp "$APK" \
            "release/Alwaha-Pro-2.8.2.apk"

          sha256sum \
            release/*.aab \
            release/*.apk \
            > release/SHA256SUMS.txt

          echo "Android outputs verified successfully."


      # ============================================================
      # 24) رفع الملفات كـArtifact
      # ============================================================
      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alwaha-Pro-2.8.2-build-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25) إنشاء GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.8.2-build.${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            release/Alwaha-Pro-2.8.2.aab \
            release/Alwaha-Pro-2.8.2.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Alwaha-Pro 2.8.2 • Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android APK/AAB build with Supabase migration deployment. Commit: ${GITHUB_SHA}."

          echo "GitHub Release created successfully."


      # ============================================================
      # 26) تنظيف مفاتيح التوقيع وحالة Supabase
      # ============================================================
      - name: Cleanup signing and Supabase files
        if: always()
        shell: bash
        run: |
          rm -f \
            android/release-key.jks \
            android/keystore.properties

          rm -rf \
            supabase/.temp \
            supabase/.branches

          echo "Sensitive signing files and temporary Supabase state cleaned."
