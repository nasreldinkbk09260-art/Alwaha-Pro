name: Alwaha-Pro • Android APK/AAB (Build Only)

on:
  push:
    branches:
      - main
      - alwaha-build-only-repair-20261011-121903
      - alwaha-games-release-2.8.3
      - alwaha-production-completion-20261014
      - alwaha-social-completion-2.8.5
      - alwaha-social-polish-2.8.6
      - alwaha-social-ultimate-2.8.8
      - alwaha-social-ultimate-3.0.0
      - alwaha-social-ultimate-3.0.1
      - alwaha-social-3.0.1-mobile-performance-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alwaha-pro-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  APP_VERSION: '3.0.1'
  APP_ID: 'pro.alwaha.app'

jobs:
  build-android:
    name: Build and verify signed Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate project files and versions
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.json
          test -s sw.js
          test -s icon.png
          test -s package.json
          test -s capacitor.config.json
          test -s scripts/build-web.mjs
          test -s scripts/native-back-handler.mjs
          test -s games.js
          test -s production-polish.js
          test -s assets/sounds/saffron_tide.mp3
          test -s assets/sounds/marimba_bloom.mp3
          test -s assets/backgrounds/bg-nebula.webp
          test -s assets/backgrounds/bg-aurora.webp
          test -s assets/backgrounds/bg-underwater.webp
          test -s assets/backgrounds/bg-moonlit.webp
          test -s supabase/migrations/20261013235236_multiplayer_game_rooms_v283.sql
          test -s supabase/migrations/20261014192321_username_follows_call_features_20261014090000.sql
          test -s supabase/migrations/20261007082734_20261005000000_fix_like_count_security.sql
          test -s supabase/migrations/20261011204819_secure_contact_privacy_defaults.sql
          test -s supabase/migrations/20261014193854_legacy_archive_api_access_hardening.sql
          test -s supabase/migrations/20261014194007_safe_public_directory_invoker.sql
          test -s supabase/migrations/20261014194053_app_settings_api_privacy.sql
          test -s supabase/migrations/20261014194820_release_policy_performance_cleanup.sql
          test -s supabase/migrations/20261014194848_rls_initplan_optimization.sql
          test -s supabase/migrations/20261014195018_game_room_join_game_validation.sql
          test -s supabase/migrations/20261014195108_game_room_join_rpc_compatibility.sql
          test -s supabase/migrations/20261014195445_friend_request_column_privileges.sql
          test -s supabase/migrations/20261014195540_friend_request_policy_consolidation.sql
          test -s supabase/functions/username-auth/index.ts
          test -s supabase/functions/call-config/index.ts
          grep -Fq 'Alwaha-Pro 3.0.1' index.html
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cap = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (pkg.version !== '3.0.1') throw new Error(`Unexpected package version: ${pkg.version}`);
          if (manifest.version !== pkg.version) throw new Error(`Manifest version mismatch: ${manifest.version}`);
          if (cap.appId !== 'pro.alwaha.app') throw new Error(`Unexpected appId: ${cap.appId}`);
          if (cap.webDir !== 'dist') throw new Error(`Unexpected webDir: ${cap.webDir}`);
          if (pkg.scripts?.build !== 'node scripts/build-web.mjs') throw new Error('Unexpected web build command.');
          for (const p of ['@capacitor/core', '@capacitor/android']) {
            if (!pkg.dependencies?.[p]) throw new Error(`Missing dependency: ${p}`);
          }
          if (!pkg.devDependencies?.['@capacitor/cli']) throw new Error('Missing @capacitor/cli.');
          console.log('Project files and configuration validated.');
          NODE

      - name: Validate JSON, service worker and application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check games.js
          node --check production-polish.js
          test -s assets/chess.min.js
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json','manifest.json','capacitor.config.json']) {
            JSON.parse(fs.readFileSync(file,'utf8'));
            console.log('Valid JSON:',file);
          }
          const html = fs.readFileSync('index.html','utf8');
          const start = html.indexOf('<script>');
          const end = start < 0 ? -1 : html.indexOf('</script>', start + '<script>'.length);
          if (start < 0 || end <= start) throw new Error('Inline application script not found.');
          fs.writeFileSync('/tmp/alwaha-pro-inline.js',html.slice(start + '<script>'.length,end),'utf8');
          NODE
          node --check /tmp/alwaha-pro-inline.js
          echo 'JSON, service worker and inline JavaScript validated.'

      - name: Run release preflight audit
        shell: bash
        run: npm run audit:release

      - name: Run mobile performance and storage audit
        run: npm run audit:performance

      - name: Install npm dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
          test -s dist/icon.png
          test -s dist/production-polish.js
          test -s dist/alwaha-native-back-handler.js
          test -s dist/assets/sounds/saffron_tide.mp3
          test -s dist/assets/sounds/marimba_bloom.mp3
          test -s dist/assets/backgrounds/bg-nebula.webp
          test -s dist/assets/backgrounds/bg-aurora.webp
          test -s dist/assets/backgrounds/bg-underwater.webp
          test -s dist/assets/backgrounds/bg-moonlit.webp
          echo 'Web build validated.'

      - name: Create or sync Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          test -s android/gradlew
          test -s android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/gradle/wrapper/gradle-wrapper.properties

      - name: Apply required Android permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text(encoding='utf-8')
          permissions = (
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          )
          app_pos = source.find('<application')
          if app_pos < 0:
              raise SystemExit('Could not find <application> in AndroidManifest.xml.')
          additions = [
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if f'android:name="{permission}"' not in source
          ]
          if additions:
              source = source[:app_pos] + '\n'.join(additions) + '\n    ' + source[app_pos:]
              path.write_text(source, encoding='utf-8')
          print('Android permissions validated.')
          PY

      - name: Keep the supplied app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          icon = Path('icon.png')
          res = Path('android/app/src/main/res')
          if not icon.is_file() or icon.stat().st_size == 0:
              raise SystemExit('Repository icon.png is missing or empty.')
          if not res.is_dir():
              raise SystemExit('Android resources directory is missing.')

          (res / 'drawable-nodpi').mkdir(parents=True, exist_ok=True)
          (res / 'mipmap-anydpi-v26').mkdir(parents=True, exist_ok=True)
          shutil.copy2(icon, res / 'drawable-nodpi' / 'ic_launcher_foreground.png')

          for directory in res.glob('mipmap-*'):
              if not directory.is_dir() or directory.name == 'mipmap-anydpi-v26':
                  continue
              # Remove only competing generated files for these two resource names.
              for name in ('ic_launcher', 'ic_launcher_round'):
                  for old in directory.glob(name + '.*'):
                      if old.suffix.lower() != '.png':
                          old.unlink()
                  shutil.copy2(icon, directory / f'{name}.png')

          adaptive = res / 'mipmap-anydpi-v26'
          (adaptive / 'ic_launcher.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''', encoding='utf-8')
          (adaptive / 'ic_launcher_round.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''', encoding='utf-8')
          print('Launcher resources copied from repository icon.png; source icon was not modified.')
          PY

      - name: Configure Android ID, version and release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: '3.0.1'
          APP_ID: 'pro.alwaha.app'
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing GitHub Secret KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub Secret KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub Secret KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing GitHub Secret KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          test -s android/release-key.jks
          chmod 600 android/release-key.jks
          {
            printf '%s\n' 'storeFile=../release-key.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('android/app/build.gradle')
          if not path.is_file():
              raise SystemExit('Expected android/app/build.gradle; refusing to guess another Gradle file.')
          source = path.read_text(encoding='utf-8')

          def matching_brace(text, open_pos):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 1
                  elif quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  elif ch == '/' and nxt == '/':
                      line_comment = True
                      i += 1
                  elif ch == '/' and nxt == '*':
                      block_comment = True
                      i += 1
                  elif ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('Unclosed Gradle block; refusing to rewrite build.gradle.')

          def find_block(text, name, scope_start=0, scope_end=None):
              if scope_end is None:
                  scope_end = len(text)
              snippet = text[scope_start:scope_end]
              match = re.search(r'(?m)^([ \t]*)' + re.escape(name) + r'\s*\{', snippet)
              if not match:
                  return None
              start = scope_start + match.start()
              opening = scope_start + match.end() - 1
              closing = matching_brace(text, opening)
              if closing > scope_end:
                  raise SystemExit(f'{name} block extends beyond its parent block.')
              return start, opening, closing, match.group(1)

          def require_block(text, name, parent=None):
              if parent is None:
                  result = find_block(text, name)
              else:
                  result = find_block(text, name, parent[1] + 1, parent[2])
              if result is None:
                  raise SystemExit(f'Could not find required Gradle block: {name}.')
              return result

          def set_property(text, block_name, prop, value, parent_name='android'):
              parent = require_block(text, parent_name) if parent_name else None
              target = require_block(text, block_name, parent)
              body_start = target[1] + 1
              body_end = target[2]
              body = text[body_start:body_end]
              match = re.search(r'(?m)^([ \t]*)' + re.escape(prop) + r'\b[^\n]*', body)
              if match:
                  replacement = f'{match.group(1)}{prop} = {value}'
                  return text[:body_start + match.start()] + replacement + text[body_start + match.end():]
              insertion = f'\n{target[3]}    {prop} = {value}'
              return text[:target[1] + 1] + insertion + text[target[1] + 1:]

          # Load signing properties after the Android plugin and before the android block.
          loader = '''def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (!keystorePropertiesFile.exists()) {
              throw new GradleException("Release keystore properties file is missing.")
          }
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          '''
          if 'def keystorePropertiesFile' not in source:
              android_match = re.search(r'(?m)^[ \t]*android\s*\{', source)
              if not android_match:
                  raise SystemExit('Could not find android block; refusing to rewrite build.gradle.')
              source = source[:android_match.start()] + loader + '\n' + source[android_match.start():]

          app_id = '"' + os.environ['APP_ID'] + '"'
          version_name = '"' + os.environ['VERSION_NAME'] + '"'
          if not os.environ['VERSION_CODE'].isdigit() or int(os.environ['VERSION_CODE']) < 1:
              raise SystemExit('VERSION_CODE must be a positive integer.')
          source = set_property(source, 'android', 'namespace', app_id, parent_name=None)
          source = set_property(source, 'defaultConfig', 'applicationId', app_id)
          source = set_property(source, 'defaultConfig', 'versionCode', os.environ['VERSION_CODE'])
          source = set_property(source, 'defaultConfig', 'versionName', version_name)
          source = set_property(source, 'defaultConfig', 'targetSdkVersion', '36')

          android_block = require_block(source, 'android')
          signing = find_block(source, 'signingConfigs', android_block[1] + 1, android_block[2])
          if signing is None:
              signing_text = '''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          '''
              source = source[:android_block[1] + 1] + signing_text + source[android_block[1] + 1:]
          else:
              release_signing = find_block(source, 'release', signing[1] + 1, signing[2])
              if release_signing is None:
                  signing_text = '''
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              '''
                  source = source[:signing[1] + 1] + signing_text + source[signing[1] + 1:]
              else:
                  raise SystemExit('Unexpected existing release signing config; refusing to overwrite it automatically.')

          android_block = require_block(source, 'android')
          build_types = require_block(source, 'buildTypes', android_block)
          release_type = find_block(source, 'release', build_types[1] + 1, build_types[2])
          if release_type is None:
              raise SystemExit('Could not find release build type.')
          release_body = source[release_type[1] + 1:release_type[2]]
          if not re.search(r'(?m)^\s*signingConfig\s+signingConfigs\.release\b', release_body):
              source = source[:release_type[1] + 1] + '\n                signingConfig signingConfigs.release' + source[release_type[1] + 1:]

          path.write_text(source, encoding='utf-8')
          print('Android ID, version and release signing configured.')
          PY

      - name: Verify Google Play target API 36
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build.gradle
          grep -Eq '^[[:space:]]*targetSdkVersion[[:space:]]*=?[[:space:]]*36([[:space:]]|$)' android/app/build.gradle
          echo 'Verified targetSdkVersion 36 for Google Play.'

      - name: Build signed APK and AAB
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify signatures and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$AAB"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          grep -Eiq 'jar verified' "$RUNNER_TEMP/aab-signature-check.txt"
          mkdir -p release
          cp "$APK" release/Alwaha-Pro-3.0.1.apk
          cp "$AAB" release/Alwaha-Pro-3.0.1.aab
          sha256sum release/Alwaha-Pro-3.0.1.apk release/Alwaha-Pro-3.0.1.aab > release/SHA256SUMS.txt
          echo 'Signed APK and AAB verified successfully.'

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Alwaha-Pro-3.0.1-build-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30
