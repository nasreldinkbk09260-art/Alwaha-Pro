name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        run: |
          mkdir -p www
          # نسخ كافة ملفات ومجلدات المشروع بالكامل بدون استثناء
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/android www/node_modules www/.git www/.github

          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "Alwaha Pro" "com.alwaha.pro" --web-dir www
          npx cap add android
          npx cap copy android
          
          # إعدادات منع التضارب وتثبيت التنسيقات
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.kotlinVersion=1.8.22

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlwahaPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
