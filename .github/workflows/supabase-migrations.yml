name: Alwaha-Pro - Supabase Migration Preview

on:
  push:
    branches:
      - alwaha-games-release-2.8.3
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type APPLY only when explicitly approving database migrations"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'push' || github.event.inputs.confirm_project == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kjuixjdtqwcsnxefftrt

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Validate configuration and link project
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN secret}"
          : "${SUPABASE_DB_PASSWORD:?Missing SUPABASE_DB_PASSWORD secret}"
          test -s supabase/migrations/20261012140000_multiplayer_game_rooms.sql
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration history
        shell: bash
        run: supabase migration list --linked

      - name: Preview migrations only on branch push
        if: github.event_name == 'push'
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Apply migrations only after explicit confirmation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_project == 'APPLY'
        shell: bash
        run: supabase db push --linked --yes
